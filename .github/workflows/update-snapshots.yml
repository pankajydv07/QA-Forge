name: Update Visual Snapshots

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm run setup

      - name: Start Target App
        run: |
          cd shopnode-api && uvicorn main:app --port 8000 &
          cd shopnode-ui && npm run dev &
          sleep 10

      - name: Update Snapshots
        run: cd qa-forge && npx playwright test tests/e2e/visual.spec.ts --update-snapshots

      - name: Commit Updated Snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chroma: update visual regression baseline snapshots"
